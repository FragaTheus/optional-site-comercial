<button
  type="button"
  class="btn-secondary w-auto max-w-none"
  aria-haspopup="dialog"
  aria-controls="site-menu"
  aria-label="menu do site"
  (click)="open()"
>
  <i class="pi pi-bars" aria-hidden="true"></i>
</button>

<dialog
  #dialog
  id="site-menu"
  aria-label="Menu"
  class="ml-auto h-dvh max-h-none w-full max-w-md surface-dark backdrop:bg-carbon/50 overflow-y-auto overscroll-contain"
  (click)="closeOnBackdrop($event)"
>
  <div class="flex min-h-full flex-col">
    <header class="flex items-center justify-between p-gutter">
      <app-logo (click)="close()" />
      <button type="button" class="btn btn-secondary w-auto max-w-none" aria-label="Fechar menu" (click)="close()">
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </header>
    <app-site-navigation class="grow px-gutter" (linkSelected)="close()" />
    <footer class="flex flex-col items-center p-gutter">
      <small>Version 1.0</small>
      <small>&copy; 2025 Optional Site Comercial</small>
    </footer>
  </div>
</dialog>
