<button
  type="button"
  class="btn-secondary"
  aria-haspopup="dialog"
  aria-controls="site-menu"
  aria-label="menu do site"
  (click)="open()"
>
  <i class="pi pi-bars"></i>
</button>

<dialog
  #dialog
  id="site-menu"
  aria-label="Menu"
  class="ml-auto h-dvh max-h-none w-full max-w-md surface-dark backdrop:bg-carbon/50 backdrop:overscroll-contain backdrop:overflow-hidden overflow-hidden overscroll-contain"
  (click)="close()"
>
  <header class="flex items-center justify-between p-gutter">
    <app-logo />
    <button type="button" class="btn btn-secondary" (click)="close()">
      <i class="pi pi-times"></i>
    </button>
  </header>
  <nav aria-label="Menu principal" class="mt-gutter flex flex-col items-start divide-y">
    @for (service of services; track service.slug) {
      <a
        [routerLink]="['/servicos', service.slug]"
        class="font-display font-bold tracking-tight text-white uppercase w-full hover:bg-slate"
        (click)="close()"
        >{{ service.label }}</a
      >
    }
  </nav>

  <footer class="absolute bottom-0 w-full flex items-center justify-center flex-col">
    <small>Version 1.0</small>
    <small>&copy; 2025 Optional Site Comercial</small>
  </footer>
</dialog>
