<section id="cases" class="surface-dark" aria-labelledby="cases-title">
  <div class="site-container site-grid gap-y-gutter">
    <header class="lg:col-span-12">
      <h2 appReveal="lines" id="cases-title">Conheça os <strong>projetos.</strong></h2>
      <p appReveal class="mt-gutter max-w-2xl">Cada projeto parte de um contexto próprio. Explore os desafios e a solução desenvolvida para cada um.</p>
    </header>
    @for (caseStudy of cases; track caseStudy.slug; let index = $index; let odd = $odd) {
      <article class="site-grid items-center gap-y-gutter border-t border-paper/15 pt-gutter lg:col-span-12">
        <figure appReveal [class]="odd ? 'lg:col-span-6 lg:order-2' : 'lg:col-span-6'">
          <img [src]="images[index % images.length]" alt="" width="767" height="511" loading="lazy" decoding="async" class="aspect-4/3 w-full rounded-xs object-cover" />
        </figure>
        <div appReveal [class]="odd ? 'lg:col-span-6 lg:order-1' : 'lg:col-span-6'">
          <h3><strong>{{ caseStudy.project }}</strong></h3>
          <p class="mt-gutter">{{ caseStudy.intro }}</p>
          <a [routerLink]="['/cases', caseStudy.slug]" class="btn btn-secondary mt-gutter">Ver case<i class="pi pi-arrow-up-right" aria-hidden="true"></i></a>
        </div>
      </article>
    }
  </div>
</section>
