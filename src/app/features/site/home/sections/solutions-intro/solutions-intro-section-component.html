<section id="atuacao" class="surface-dark">
  <div class="site-container site-grid gap-y-gutter">
    <header class="lg:col-span-12 flex flex-col gap-gutter">
      <h2 appReveal="lines">Tecnologia para <strong>cada operação.</strong></h2>
      <p appReveal class="max-w-xl">
        Descubra como nossas soluções tecnológicas podem otimizar cada operação do seu negócio.
      </p>
    </header>

    <ul class="site-grid gap-y-gutter lg:col-span-12">
      @for (solution of solutions; track solution.slug) {
        <li appReveal class="lg:col-span-4">
          <a
            [routerLink]="['/servicos', solution.slug]"
            class="group media-card card h-full min-h-72 flex-col items-stretch justify-between gap-gutter"
          >
            <img
              [src]="solution.image"
              alt=""
              width="767"
              height="511"
              loading="lazy"
              decoding="async"
              class="media-card-img brightness-70"
            />
            <div class="media-card-scrim" aria-hidden="true"></div>
            <h3><strong>{{ solution.label }}</strong></h3>
            <p>{{ solution.text }}</p>
            <i
              class="pi pi-arrow-right self-end text-signal transition-transform group-hover:translate-x-2 motion-reduce:transition-none"
              aria-hidden="true"
            ></i>
          </a>
        </li>
      }
    </ul>

    <footer class="lg:col-span-12">
      <a href="#sobre" class="btn btn-secondary">Nossa liderança<i class="pi pi-arrow-down" aria-hidden="true"></i></a>
    </footer>
  </div>
</section>
