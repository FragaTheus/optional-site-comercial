<section id="home-hero" aria-labelledby="home-hero-title">
  <div class="site-container site-grid gap-gutter">
    <header class="lg:col-span-9">
      <div class="flex flex-col eyebrow mb-gutter">
        <p class="text-carbon" appReveal>Est. 2025 // SP</p>
        <p appReveal>Studio de Engenharia de Software</p>
      </div>
      <h1 id="home-hero-title" appReveal="lines" class="max-w-7xl">
        <strong>Infraestrutura </strong> para aumentar a <strong>eficiência</strong> da sua
        <strong>empresa.</strong>
      </h1>
    </header>

    <ul class="lg:col-span-4 flex flex-col gap-2">
      @for (stat of stats; track stat.data) {
        <li appReveal class="flex items-baseline gap-2">
          <strong class="text-3xl text-carbon">{{ stat.label }}</strong>
          <span>{{ stat.data }}</span>
        </li>
      }
    </ul>

    <footer class="lg:col-span-8 flex items-center gap-2 lg:justify-end lg:self-end flex-wrap">
      <a href="#objecoes" class="btn-secondary"
        >Entender atuação<i class="pi pi-arrow-down" aria-hidden="true"></i
      ></a>
    </footer>
  </div>
</section>
