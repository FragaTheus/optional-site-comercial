<section id="home-hero" aria-labelledby="home-hero-title">
  <div class="site-container site-grid gap-gutter">
    <header class="lg:col-span-full">
      <div class="flex flex-col eyebrow mb-gutter">
        <p class="text-carbon" appReveal>Est. 2025 // SP</p>
        <p appReveal>Studio de Engenharia de Software</p>
      </div>
      <h1 id="home-hero-title" appReveal="lines">
        <strong>Infraestrutura</strong> para aumentar a <strong>produtividade</strong> e
        <strong>aquisição</strong> de novos clientes.
      </h1>
    </header>

    <footer class="flex items-center lg:justify-end gap-2 flex-wrap lg:col-span-4 lg:col-start-9">
      <app-btn-cta
        [cta]="{
          label: 'Fale conosco',
          wppMessage:
            'Olá! Vim pelo proposta inicial da Optional e gostaria de falar com a Optional.',
        }"
      />
      <a href="#servicos" class="btn-secondary">Soluções <i class="pi pi-arrow-down"></i></a>
    </footer>
  </div>
</section>
