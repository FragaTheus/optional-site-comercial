<section id="home-hero" aria-labelledby="home-hero-title">
  <div class="site-container site-grid gap-y-gutter">
    <header class="lg:col-span-full">
      <div class="flex items-center justify-between flex-wrap eyebrow mb-gutter">
        <p appReveal>Studio de Engenharia de Software</p>
        <p appReveal class="text-carbon">Est. 2025 // São Paulo</p>
      </div>
      <h1 id="home-hero-title" appReveal="lines" class="text-9xl">
        <strong>Infraestrutura digital</strong> para aumentar a <strong>produtividade</strong> da
        sua empresa
      </h1>
    </header>

    <footer class="w-full flex items-center justify-between gap-gutter flex-wrap lg:col-span-full">
      <div class="flex items-center gap-gutter">
        @for (a of asides; track a.label) {
          <div class="flex flex-col">
            <p class="font-bold" appReveal>
              <strong>{{ a.label }}</strong>
            </p>
            <p class="text-carbon text-xs" appReveal>{{ a.data }}</p>
          </div>
        }
      </div>

      <div class="flex items-center gap-2 flex-wrap">
        <a href="#servicos" class="btn-primary border border-signal">Fale conosco</a>
        <a href="#servicos" class="btn-secondary">Ver projetos <i class="pi pi-arrow-down"></i></a>
      </div>
    </footer>
  </div>
</section>
