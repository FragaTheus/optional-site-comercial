<!-- Seção escura: cada serviço é uma faixa com tema, proposta, explicação e link; posições diferentes no grid, separadas por filetes -->
<section id="servicos" class="surface-dark" aria-labelledby="servicos-title">
  <div class="site-container site-grid gap-y-gutter">
    <header class="lg:col-span-full items-center justify-center text-center">
      <h2 appReveal="lines" id="servicos-title"><strong>Uma solução </strong> para cada desafio</h2>
      <p></p>
    </header>

    @for (service of services; track service.slug; let odd = $odd) {
      <article
        class="site-grid items-center gap-y-gutter border-t border-paper/15 pt-gutter lg:col-span-12"
      >
        <figure appReveal class="lg:col-span-6" [class.lg:order-2]="odd">
          <video
            [appLazyVideo]="service.video.src"
            [poster]="service.video.poster"
            [attr.aria-label]="service.video.label || null"
            [attr.aria-hidden]="service.video.label ? null : true"
            muted
            loop
            playsinline
            preload="none"
            class="aspect-4/3 w-full rounded-xs object-cover"
          ></video>
        </figure>

        <div class="lg:col-span-6" [class.lg:order-1]="odd">
          <p appReveal class="eyebrow">{{ service.theme }}</p>
          <h3 appReveal="lines" class="mt-gutter">
            <strong>{{ service.name }}</strong>
          </h3>
          <p appReveal class="mt-gutter text-white">{{ service.value }}</p>
          <p appReveal class="mt-gutter">{{ service.text }}</p>

          <details appReveal class="group mt-gutter border-t border-paper/15 pt-gutter">
            <summary
              class="eyebrow flex cursor-pointer list-none items-center justify-between gap-gutter [&::-webkit-details-marker]:hidden"
            >
              Projeto entregue
              <span aria-hidden="true" class="group-open:rotate-45">+</span>
            </summary>
            <aside class="mt-gutter">
              <a
                [href]="service.proof.url"
                target="_blank"
                rel="noopener"
                class="block text-white underline"
                >{{ service.proof.project }}</a
              >
              <p class="mt-2">{{ service.proof.solved }}</p>
            </aside>
          </details>

          <a
            appReveal
            [routerLink]="['/servicos', service.slug]"
            class="btn btn-tertiary mt-gutter text-white"
            >{{ service.anchor }}</a
          >
        </div>
      </article>
    }
  </div>
</section>
