<section id="prova-social" aria-labelledby="socialproof-title">
  <div class="site-container site-grid">
    <h2 id="socialproof-title" class="sr-only">Números das operações analisadas pela Optional</h2>
    <dl class="grid grid-cols-1 gap-gutter md:grid-cols-3 lg:col-span-12">
      @for (proof of proofs; track proof.label) {
        <div appReveal class="card card-primary flex flex-col-reverse justify-between gap-gutter">
          <dt class="eyebrow">{{ proof.label }}</dt>
          <dd class="stat">{{ proof.value }}</dd>
        </div>
      }
    </dl>
  </div>
</section>
