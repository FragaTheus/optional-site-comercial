<section id="projetos">
  <div class="site-container site-grid gap-y-gutter">
    <header class="lg:col-span-6 flex flex-col gap-gutter">
      <h2 appReveal="lines">Do desafio a <br /><strong>solução.</strong></h2>
      <p appReveal class="max-w-xl">
        Conheça nossos principais casos de sucesso desenvolvidos baseados nos desafios listados
        pelas empresas clientes
      </p>
    </header>

    <div class="lg:col-span-6 lg:row-span-2 flex flex-col">
      @for (caseStudy of cases; track caseStudy.slug) {
        <details appReveal class="group border-t border-carbon/15 py-gutter last:border-b">
          <summary
            class="flex cursor-pointer list-none items-center justify-between gap-gutter [&::-webkit-details-marker]:hidden"
          >
            <h3>
              <strong class="whitespace-pre-line">{{ caseStudy.project }}</strong>
            </h3>
            <span aria-hidden="true" class="group-open:rotate-45">+</span>
          </summary>
          <div data-case-content class="mt-gutter grid grid-cols-1 gap-gutter md:grid-cols-2">
            <div class="flex flex-col items-start gap-gutter">
              <small class="text-sm">{{ caseStudy.intro }}</small>
              <a [routerLink]="['/cases', caseStudy.slug]" class="btn btn-secondary self-start"
                >Ver mais<i class="pi pi-arrow-up-right" aria-hidden="true"></i
              ></a>
            </div>
            <img
              [src]="caseStudy.heroImage"
              [alt]="'Imagem do projeto ' + caseStudy.project"
              width="1840"
              height="963"
              loading="lazy"
              decoding="async"
              class="aspect-4/3 max-h-48 w-full rounded-xl object-cover object-top"
            />
          </div>
        </details>
      }
    </div>

    <footer class="lg:col-span-6 flex items-end">
      <a href="#atuacao" class="btn btn-secondary"
        >Conhecer as soluções<i class="pi pi-arrow-down" aria-hidden="true"></i
      ></a>
    </footer>
  </div>
</section>
