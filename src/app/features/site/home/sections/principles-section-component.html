<!-- Retorno à esquerda, sobre fundo branco -->
<section class="bg-white py-24 md:py-40">
  <div class="site-container site-grid gap-y-12">
    <h2 appReveal="lines" class="text-5xl md:col-span-5"><strong>Estrutura</strong> no lugar de <strong>improviso.</strong></h2>
    <dl class="grid gap-10 md:col-span-6 md:col-start-7">
      @for (principle of principles; track principle.title) {
        <div>
          <dt class="text-2xl font-bold text-carbon">{{ principle.title }}</dt>
          <dd class="mt-2">{{ principle.text }}</dd>
        </div>
      }
    </dl>
  </div>
</section>
