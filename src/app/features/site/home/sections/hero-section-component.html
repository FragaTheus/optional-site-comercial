<!-- Vazio no topo; a frase se ancora na base, deslocada para a direita (eixo em ~25% da largura) -->
<section class="flex items-end pb-16 pt-section-s md:min-h-[min(46rem,calc(100dvh-4rem))] md:pb-24">
  <div class="site-container site-grid gap-y-10">
    <h1 appReveal="lines" class="text-8xl md:col-span-11 md:col-start-2"><strong>Software</strong> sob medida</h1>
    <p appReveal class="text-xl md:col-span-4">A Optional desenvolve CRM, sistemas de gestão, automações e sites para empresas que já passaram do ponto em que planilhas e ferramentas soltas dão conta.</p>
    <div appReveal class="flex flex-wrap items-center gap-6 text-carbon md:col-span-4 md:col-start-9 md:justify-self-end">
      <a [href]="contactUrl" class="btn btn-primary">Apresentar projeto</a>
      <a href="#servicos" class="btn btn-tertiary">Conhecer serviços</a>
    </div>
  </div>
</section>
