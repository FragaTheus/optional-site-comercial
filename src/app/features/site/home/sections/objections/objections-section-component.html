<!-- Três situações em alinhamentos diferentes, separadas por filetes discretos; a conclusão em bloco escuro prepara a seção de serviços -->
<section>
  <div class="site-container site-grid gap-y-gutter">
    <h2 appReveal="lines" class="text-8xl lg:col-span-10 lg:col-start-2">Nem tudo que <strong>funciona</strong> está <strong>resolvido.</strong></h2>
    <p appReveal class="text-xl lg:col-span-4 lg:col-start-8">Algumas limitações não impedem uma empresa de trabalhar. Apenas se tornam parte da rotina.</p>

    @for (item of items; track item.label) {
      <article appReveal class="site-grid mt-gutter gap-y-gutter border-t border-carbon/15 pt-gutter lg:col-span-12">
        <p class="eyebrow lg:col-span-2">{{ item.label }}</p>
        <div [class]="item.body">
          <h3 class="text-4xl" [innerHTML]="item.headline"></h3>
          <p class="mt-gutter text-xl">{{ item.text }}</p>
        </div>
      </article>
    }

    <div appReveal class="surface-dark mt-gutter rounded-xs p-gutter lg:col-span-12 md:p-gutter">
      <h3 class="text-6xl md:max-w-4xl">
        <span class="block">Não é sobre <strong>trocar tudo.</strong></span>
        <span class="block">É sobre <strong>resolver</strong> o que precisa ser resolvido.</span>
      </h3>
    </div>
  </div>
</section>
