<!-- Três situações em alinhamentos diferentes, separadas por filetes discretos; a conclusão em bloco escuro prepara a seção de serviços -->
<section class="py-section-m">
  <div class="site-container site-grid gap-y-8">
    <h2 appReveal="lines" class="text-8xl md:col-span-10 md:col-start-2">Nem tudo que <strong>funciona</strong> está <strong>resolvido.</strong></h2>
    <p appReveal class="text-xl md:col-span-4 md:col-start-8">Algumas limitações não impedem uma empresa de trabalhar. Apenas se tornam parte da rotina.</p>

    @for (item of items; track item.label) {
      <article appReveal class="site-grid mt-section-s gap-y-4 border-t border-carbon/15 pt-8 md:col-span-12">
        <p class="eyebrow md:col-span-2">{{ item.label }}</p>
        <div [class]="item.body">
          <h3 class="text-4xl" [innerHTML]="item.headline"></h3>
          <p class="mt-4 text-xl">{{ item.text }}</p>
        </div>
      </article>
    }

    <div appReveal class="surface-dark mt-section-s rounded-xs p-8 md:col-span-12 md:p-16">
      <h3 class="text-6xl md:max-w-4xl">
        <span class="block">Não é sobre <strong>trocar tudo.</strong></span>
        <span class="block">É sobre <strong>resolver</strong> o que precisa ser resolvido.</span>
      </h3>
    </div>
  </div>
</section>
