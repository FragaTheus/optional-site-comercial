<!-- Três situações em alinhamentos diferentes, separadas por filetes discretos; a conclusão em bloco escuro prepara a seção de serviços -->
<section id="atuacao">
  <div class="site-container site-grid grid-flow-dense p-0">
    <header class="lg:col-span-6 lg:col-start-7 lg:text-end p-gutter">
      <h2 appReveal="lines">Onde a <strong>tecnologia</strong> faz a <strong>diferença</strong></h2>
    </header>

    <ul
      class="lg:col-span-6 lg:order-first lg:row-span-2 flex lg:flex-col overflow-x-auto scrollbar-none px-gutter gap-gutter lg:py-gutter"
    >
      @for (item of items; track item.label) {
        <li>
          <article
            appReveal
            class="card card-primary min-w-3xs lg:w-full flex flex-col gap-gutter min-h-68"
          >
            <span class="eyebrow">{{ item.label }}</span>
            <h4 [innerHTML]="item.headline" class="whitespace-pre-line text-carbon"></h4>
            <p>{{ item.text }}</p>
          </article>
        </li>
      }
    </ul>

    <footer appReveal class="lg:col-span-6 p-gutter">
      <div class="card surface-dark flex flex-col gap-gutter justify-between">
        <h3>Sua <strong>empresa enfrenta</strong> um desses <strong>desafios?</strong></h3>
        <app-btn-cta
          [cta]="{
            label: 'Vamos conversar',
            wppMessage: 'Olá! Gostaria de falar sobre os desafios que minha empresa enfrenta.',
          }"
        />
      </div>
    </footer>
  </div>
</section>
