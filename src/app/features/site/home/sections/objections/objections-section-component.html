<!-- Três situações em alinhamentos diferentes, separadas por filetes discretos; a conclusão em bloco escuro prepara as seções seguintes -->
<section id="objecoes">
  <div class="site-container site-grid grid-flow-dense p-0">
    <header class="lg:col-span-6 lg:col-start-7 lg:text-end p-gutter">
      <h2 appReveal="lines">Onde a <strong>tecnologia</strong> faz a <strong>diferença</strong></h2>
    </header>

    <ul
      (touchstart)="onTouchStart($event)"
      (touchend)="onTouchEnd($event)"
      class="snap-x snap-mandatory lg:snap-none lg:col-span-6 lg:order-first lg:row-span-2 flex lg:flex-col overflow-x-auto scrollbar-none px-gutter gap-gutter lg:py-gutter"
    >
      @for (item of items; track item.headline) {
        <li class="snap-start snap-always">
          <article appReveal [class]="item.body">
            <h4 class="whitespace-pre-line">
              <strong>{{ item.headline }}</strong>
            </h4>
            <p>{{ item.text }}</p>
          </article>
        </li>
      }
    </ul>

    <footer appReveal class="lg:col-span-6 p-gutter items-end flex">
      <div class="card surface-dark flex flex-col gap-gutter justify-between">
        <h3><strong>Sua empresa enfrenta</strong> um desses <strong>desafios?</strong></h3>
        <div class="flex items-center flex-wrap gap-2">
          <app-btn-cta
            [cta]="{
              label: 'Vamos conversar',
              wppMessage: 'Olá! Gostaria de falar sobre os desafios que minha empresa enfrenta.',
            }"
          />
          <a href="#projetos" class="btn-secondary h-full"
            >Ver na prática<i class="pi pi-arrow-down" aria-hidden="true"></i
          ></a>
        </div>
      </div>
    </footer>
  </div>
</section>
