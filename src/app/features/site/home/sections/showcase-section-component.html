<!-- Fragmentos de interface em blocos desiguais; quebram o ritmo tipográfico entre serviços e evolução -->
<section class="py-section-m">
  <div class="site-container site-grid gap-y-gutter">
    <h2 appReveal="lines" class="text-6xl md:col-span-7">Interfaces <strong>sob medida.</strong></h2>
    <p appReveal class="text-xl md:col-span-4 md:col-start-9 md:self-end">Exemplos ilustrativos do tipo de interface que construímos. Não são telas de clientes.</p>

    <div data-stagger=":scope > figure" class="contents">
      <figure data-ui class="rounded-xs bg-white p-6 md:col-span-7 md:mt-section-s md:p-8">
        <div class="grid gap-4 sm:grid-cols-3">
          @for (column of pipeline; track column.stage) {
            <div class="rounded-xs bg-carbon/5 p-3">
              <p class="text-sm font-semibold text-carbon">{{ column.stage }}</p>
              <ul class="mt-3 flex flex-col gap-2">
                @for (item of column.items; track item) {
                  <li class="rounded-xs bg-white p-3 text-sm text-carbon">{{ item }}</li>
                }
              </ul>
            </div>
          }
        </div>
        <figcaption class="mt-5 text-sm">CRM: contatos organizados por etapa do processo comercial.</figcaption>
      </figure>

      <figure data-ui class="surface-dark rounded-xs p-6 md:col-span-5 md:p-8">
        <table class="w-full text-left text-sm">
          <caption class="sr-only">Registros e etapas</caption>
          <thead><tr class="text-white"><th class="pb-3 font-semibold">Registro</th><th class="pb-3 font-semibold">Etapa</th><th class="pb-3 font-semibold">Status</th></tr></thead>
          <tbody>
            @for (record of records; track record.name) {
              <tr class="border-t border-paper/15"><td class="py-3 pr-2 text-paper">{{ record.name }}</td><td class="py-3 pr-2">{{ record.step }}</td><td class="py-3">{{ record.status }}</td></tr>
            }
          </tbody>
        </table>
        <figcaption class="mt-5 text-sm">ERP: cada registro com etapa e histórico rastreáveis.</figcaption>
      </figure>

      <figure data-ui class="rounded-xs bg-carbon/5 p-6 md:col-span-5 md:p-8">
        <ol class="flex flex-col gap-3">
          @for (step of flow; track step) {
            <li class="rounded-xs bg-white p-4 text-base text-carbon">{{ step }}</li>
          }
        </ol>
        <figcaption class="mt-5 text-sm">Automação: do formulário ao aviso interno, sem cópia manual.</figcaption>
      </figure>

      <figure data-ui class="rounded-xs bg-white p-6 md:col-span-7 md:p-8">
        <div class="rounded-xs bg-paper p-8">
          <p class="font-display text-3xl font-extrabold tracking-heading text-carbon">Título da campanha em destaque</p>
          <p class="mt-3 max-w-md text-base">Uma proposta clara e um único caminho para o contato.</p>
          <span class="btn btn-primary mt-6 text-carbon">Falar com a equipe</span>
        </div>
        <figcaption class="mt-5 text-sm">Landing page: uma ação principal, com origem do contato registrada.</figcaption>
      </figure>
    </div>
  </div>
</section>
