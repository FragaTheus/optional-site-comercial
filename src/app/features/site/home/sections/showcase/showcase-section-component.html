<!-- Composições abstratas em blocos desiguais; quebram o ritmo tipográfico entre serviços e evolução -->
<section class="py-section-m">
  <div class="site-container site-grid gap-y-gutter">
    <h2 appReveal="lines" class="text-6xl md:col-span-7">Estrutura <strong>sob medida.</strong></h2>
    <p appReveal class="text-xl md:col-span-4 md:col-start-9 md:self-end">Composições abstratas que traduzem como organizamos processos, dados e interfaces.</p>

    <div data-stagger=":scope > figure" class="contents">
      @for (image of images; track image.src) {
        <figure data-ui [class]="image.layout">
          <img [src]="image.src" alt="" width="767" height="511" loading="lazy" decoding="async" class="h-auto w-full rounded-xs" />
          <figcaption class="mt-3 text-sm">{{ image.caption }}</figcaption>
        </figure>
      }
    </div>
  </div>
</section>
