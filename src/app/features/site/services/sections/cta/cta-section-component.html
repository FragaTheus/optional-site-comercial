<section id="contato" class="surface-dark text-center">
  <div class="site-container site-grid">
    <h2 appReveal="lines" class="lg:col-span-10 lg:col-start-2">{{ service().cta.headline.lead }} <strong>{{ service().cta.headline.key }}</strong></h2>
    <p appReveal class="mx-auto mt-gutter max-w-xl lg:col-span-12">{{ service().cta.text }}</p>
    <div appReveal class="mt-gutter lg:col-span-12"><app-btn-cta [cta]="{ label: service().cta.label, wppMessage: service().cta.message }" /></div>
  </div>
</section>
