<!-- Quatro colunas sob um título deslocado -->
<section>
  <div class="site-container site-grid gap-y-8">
    <h2 appReveal="lines" class="text-5xl lg:col-span-8 lg:col-start-2">Diferenciais da <strong>Optional</strong></h2>
    <ul data-stagger=":scope > li" class="mt-10 grid gap-gutter sm:grid-cols-2 lg:col-span-12 lg:grid-cols-4">
      @for (item of service().differentials; track item.name) {
        <li class="border-t border-carbon/15 pt-6">
          <h3 class="text-2xl"><strong>{{ item.name }}</strong></h3>
          <p class="mt-3 text-lg">{{ item.text }}</p>
        </li>
      }
    </ul>
  </div>
</section>
