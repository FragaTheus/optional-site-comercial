<!-- Seção escura: título à esquerda, capacidades em duas colunas à direita -->
<section id="funcionalidades" class="surface-dark">
  <div class="site-container site-grid gap-y-gutter">
    <h2 appReveal="lines" class=" lg:col-span-5">Funcionalidades e <strong>capacidades</strong></h2>
    <ul data-stagger=":scope > li" class="grid gap-x-gutter gap-y-gutter lg:col-span-7 lg:col-start-6 sm:grid-cols-2">
      @for (item of service().capabilities; track item.name) {
        <li class="border-t border-paper/15 pt-gutter">
          <h3 class=""><strong>{{ item.name }}</strong></h3>
          <p class="mt-gutter">{{ item.text }}</p>
        </li>
      }
    </ul>
  </div>
</section>
