<app-page-hero titleId="service-hero-title" [image]="service().simulator ? '' : service().image">
  <app-breadcrumb
    [ancestors]="[{ label: 'Início', routerLink: '/' }]"
    [currentLabel]="service().label"
  />
  <p class="eyebrow text-sm">{{ service().label }}</p>
  <h1 id="service-hero-title" appReveal="lines" class="lg:text-6xl">
    {{ service().h1.lead }} <strong>{{ service().h1.key }}</strong>
  </h1>
  <p appReveal class="max-w-xl">{{ service().intro }}</p>
  <footer class="flex items-center flex-wrap gap-2">
    <app-btn-cta [cta]="{ label: service().cta.label, wppMessage: service().cta.message }" />
    <a
      [routerLink]="['/servicos', service().slug]"
      fragment="service-challenges"
      class="btn btn-secondary"
    >
      Conhecer os desafios<i class="pi pi-arrow-down" aria-hidden="true"></i>
    </a>
  </footer>
  @if (service().simulator) {
    <app-hours-simulator aside class="lg:col-span-6" />
  }
</app-page-hero>
