<!-- Assimétrico: h1 à direita, introdução à esquerda abaixo, CTAs à direita -->
<section>
  <div class="site-container site-grid gap-y-gutter">
    <nav aria-label="Trilha de navegação" class="text-sm lg:col-span-12">
      <ol class="flex flex-wrap items-center gap-gutter">
        <li>
          <a routerLink="/" class="underline underline-offset-4 hover:decoration-signal">Início</a>
        </li>
        <li aria-hidden="true">/</li>
        <li>
          <a
            routerLink="/"
            fragment="servicos"
            class="underline underline-offset-4 hover:decoration-signal"
            >Serviços</a
          >
        </li>
        <li aria-hidden="true">/</li>
        <li aria-current="page">{{ service().label }}</li>
      </ol>
    </nav>
    <h1 appReveal="lines" class="text-7xl lg:col-span-11">
      {{ service().h1.lead }} <strong>{{ service().h1.key }}</strong>
    </h1>
    <p appReveal class="text-xl lg:col-span-6">{{ service().intro }}</p>
    <div
      appReveal
      class="flex flex-wrap items-center gap-gutter text-carbon lg:col-span-4 lg:col-start-9 md:justify-self-end"
    >
      <app-btn-cta [cta]="{ label: 'Apresentar projeto', wppMessage: 'Olá! Vim pelo topo da página de serviço e gostaria de apresentar meu projeto.' }" />
      <a href="#funcionalidades" class="btn btn-tertiary">Ver funcionalidades</a>
    </div>
  </div>
</section>
