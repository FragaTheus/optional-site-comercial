<!-- Cards com imagem de fundo (object-cover), gradiente horizontal e texto sobre a imagem; larguras desiguais no grid -->
<section>
  <div class="site-container site-grid gap-y-gutter">
    <h2 appReveal="lines" class=" lg:col-span-7">Estrutura <strong>sob medida.</strong></h2>
    <p appReveal class=" lg:col-span-4 lg:col-start-9 md:self-end">Sob medida não é um pacote adaptado. É uma estrutura montada a partir da operação de cada empresa.</p>

    <div data-stagger=":scope > article" class="contents">
      @for (card of cards; track card.src) {
        <article [class]="'media-card ' + card.layout">
          <img [src]="card.src" alt="" width="767" height="511" loading="lazy" decoding="async" class="media-card-img" />
          <div class="media-card-fade" aria-hidden="true"></div>
          <div class="media-card-scrim" aria-hidden="true"></div>
          <div class="max-w-xl p-gutter">
            <p class="eyebrow">{{ card.label }}</p>
            <h3 class="mt-gutter text-paper"><strong>{{ card.title }}</strong></h3>
            <p class="mt-gutter text-paper">{{ card.text }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
