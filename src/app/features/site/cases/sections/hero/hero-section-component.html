<section class="surface-dark relative isolate overflow-hidden">
  <img [src]="caseStudy().heroImage" alt="" width="1840" height="963" class="absolute inset-0 -z-30 size-full object-cover object-top" />
  <div aria-hidden="true" class="absolute inset-0 -z-20 bg-linear-to-r from-carbon via-transparent to-carbon"></div>
  <div aria-hidden="true" class="absolute inset-0 -z-10 bg-carbon/75"></div>
  <div class="site-container site-grid min-h-112 content-end gap-y-gutter">
    <app-breadcrumb
      class="lg:col-span-12"
      [ancestors]="[{ label: 'Início', routerLink: '/' }, { label: 'Cases' }]"
      [currentLabel]="caseStudy().project"
    />
    <div class="lg:col-span-9">
      <p class="eyebrow">Case Optional</p>
      <h1 appReveal="lines" class="mt-gutter"><strong>{{ caseStudy().project }}</strong></h1>
      <p appReveal class="mt-gutter max-w-2xl text-white">{{ caseStudy().intro }}</p>
      <div appReveal class="mt-gutter flex flex-wrap gap-gutter">
        <a [href]="caseStudy().projectUrl" target="_blank" rel="noopener" class="btn btn-primary">{{ caseStudy().projectLinkLabel }}<i class="pi pi-arrow-up-right" aria-hidden="true"></i></a>
        <a [routerLink]="[]" fragment="problema" class="btn btn-secondary">Entender solução</a>
      </div>
    </div>
  </div>
</section>
