<section class="bg-white" aria-labelledby="case-solution-title">
  <div class="site-container site-grid gap-y-gutter">
    <div class="lg:col-span-5">
      <h2 appReveal="lines" id="case-solution-title">A <strong>solução.</strong></h2>
      <p appReveal class="mt-gutter">{{ caseStudy().implementation }}</p>
      <a appReveal [routerLink]="['/servicos', caseStudy().service]" class="btn btn-tertiary mt-gutter text-carbon">Conhecer o serviço<i class="pi pi-arrow-up-right" aria-hidden="true"></i></a>
    </div>
    <div class="lg:col-span-6 lg:col-start-7">
      <h3 appReveal="lines"><strong>Requisitos</strong> do produto</h3>
      <ul class="mt-gutter">
        @for (requirement of caseStudy().requirements; track requirement.name) {
          <li appReveal class="border-t border-carbon/15 py-gutter">
            <h4><strong>{{ requirement.name }}</strong></h4>
            <p class="mt-2">{{ requirement.text }}</p>
          </li>
        }
      </ul>
    </div>
    @for (image of caseStudy().images; track image.src) {
      <figure appReveal class="lg:col-span-6">
        <img [src]="image.src" [alt]="image.alt" width="1840" height="963" loading="lazy" decoding="async" class="aspect-4/3 w-full rounded-xs object-cover object-top" />
      </figure>
    }
  </div>
</section>
