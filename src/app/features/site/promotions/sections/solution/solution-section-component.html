<section aria-labelledby="promotion-solution-title" id="promocao-solucao">
  <div class="site-container site-grid gap-gutter">
    <video
      [src]="promotion().solution.video.src"
      class="aspect-video w-full rounded-xl shadow-xl object-cover lg:col-span-6 max-w-2xl"
      aria-hidden="true"
      autoplay
      muted
      loop
      playsinline
    ></video>
    <div class="flex flex-col gap-gutter lg:col-span-6">
      <h2 id="promotion-solution-title" appReveal="lines">
        {{ promotion().solution.heading.lead }}
        <strong>{{ promotion().solution.heading.key }}</strong>
        {{ promotion().solution.heading.tail }}
      </h2>
      <ul>
        @for (benefit of promotion().solution.benefits; track benefit) {
          <li class="border-t border-carbon/15 py-gutter last:border-b">
            <p class="text-xl text-carbon">{{ benefit }}</p>
          </li>
        }
      </ul>
    </div>
  </div>
</section>
