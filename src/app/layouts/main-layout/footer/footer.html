<footer class="surface-dark py-16">
  <div class="site-container site-grid gap-y-10">
    <div class="md:col-span-6">
      <p appReveal class="font-display text-3xl font-extrabold tracking-tight text-white">Optional<span class="text-signal" aria-hidden="true">&lt;&gt;</span></p>
      <p appReveal class="mt-4 max-w-md">Software e infraestrutura digital sob medida para empresas.</p>
    </div>
    <nav appReveal aria-label="Rodapé" class="flex flex-col gap-3 md:col-span-2 md:col-start-7">
      @for (link of links; track link.fragment) {
        <a routerLink="/" [fragment]="link.fragment" class="hover:text-white">{{ link.label }}</a>
      }
    </nav>
    <nav appReveal aria-label="Serviços" class="flex flex-col gap-3 md:col-span-4 md:col-start-9">
      @for (service of services; track service.slug) {
        <a [routerLink]="['/servicos', service.slug]" class="hover:text-white">{{ service.label }}</a>
      }
    </nav>
    <p appReveal class="text-sm md:col-span-12">© {{ year }} Optional. Todos os direitos reservados.</p>
  </div>
</footer>
