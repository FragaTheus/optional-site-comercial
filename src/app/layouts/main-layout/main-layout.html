<a href="#conteudo" class="btn btn-primary fixed top-2 left-2 z-50 -translate-y-20 focus:translate-y-0">Ir para o conteúdo</a>

<app-header (menuOpen)="open()" />

<dialog #drawer aria-label="Menu" class="my-0 mr-0 ml-auto h-dvh max-h-none w-full max-w-sm surface-dark p-gutter backdrop:bg-carbon/60" (click)="closeOnBackdrop($event)">
  <div class="flex items-center justify-between">
    <span class="text-2xl font-display font-extrabold tracking-tight text-white">Optional<span class="text-signal" aria-hidden="true">&lt;&gt;</span></span>
    <button type="button" class="btn btn-secondary" (click)="close()">Fechar</button>
  </div>
  <nav aria-label="Menu principal" class="mt-16 flex flex-col gap-6">
    @for (link of links; track link.fragment) {
      <a routerLink="/" [fragment]="link.fragment" class="font-display text-4xl font-bold tracking-tight text-white uppercase" (click)="close()">{{ link.label }}</a>
    }
    <a [href]="contactUrl" class="btn btn-primary mt-6 self-start" (click)="close()">Apresentar projeto</a>
  </nav>
</dialog>

<main id="conteudo" tabindex="-1">
  <router-outlet />
</main>

<app-footer />
